<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <!-- interactive-widget=resizes-content: when the phone keyboard opens, the page
       shrinks to the space above it, so the hint bar can sit just above the keyboard. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Answer editor: four versions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F6F5F2;
      --surface: #FFFFFF;
      --text: #1C1C1A;
      --text-strong2: #3E3C38;
      --text-2: #5E5B55;
      --hint: #67645E;
      --accent: #1D6B63;
      --border: #DDD9D1;
      --border-input: #CFCAC0;
      --divider: #E7E4DE;
      --soft: #EFEDE8;
      --interim: #75726B;
      --dock-h: 0px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { margin: 0; }
    body {
      font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      line-height: 1.4;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    svg { flex: none; }

    .topbar { display: none; }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 100dvh;
    }

    /* Question bar */
    .qbar {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: -16px -16px 0;
      padding: 16px 16px 0;
      background: var(--bg);
    }
    .qcard {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 18px 20px;
    }
    .qhead { display: flex; align-items: center; gap: 12px; }
    .tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--soft);
      color: var(--text-strong2);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 13px; font-weight: 700;
      flex: none;
    }
    .qtext { display: block; margin: 14px 0 0; font-size: 22px; line-height: 1.32; font-weight: 700; }
    .chev { margin-left: auto; display: none; }
    body.kb .qbar:not(.open) .qcard { padding: 0 14px 0 10px; height: 52px; display: flex; align-items: center; gap: 12px; }
    body.kb .qbar:not(.open) .qhead { flex: none; }
    body.kb .qbar:not(.open) .qtext {
      margin: 0; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0;
    }
    body.kb .qcard { display: flex; }
    body.kb .chev { display: block; }
    body.kb .qbar.open .qcard { flex-direction: column; align-items: stretch; }
    body.kb .qbar.open .qhead { width: 100%; }
    body.kb .qbar.open .chev { transform: rotate(180deg); }
    .qinner { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    body.kb .qbar:not(.open) .qinner { flex-direction: row; align-items: center; gap: 12px; }

    /* Working area */
    .working {
      background: var(--surface);
      border: 1.5px solid var(--border-input);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .working:focus-within { border: 2px solid var(--accent); }
    .stack {
      flex: 1;
      min-height: 40vh;
      padding: 16px 16px 4px;
      cursor: text;
    }
    body.kb .stack { min-height: 0; }
    .section + .section { margin-top: 10px; }
    textarea.box {
      display: block;
      width: 100%;
      border: 0;
      outline: none;
      resize: none;
      overflow: hidden;
      background: transparent;
      padding: 4px 0;
      min-height: 48px;
      font-size: 17px;
      line-height: 1.5;
    }
    textarea.box::placeholder { color: var(--hint); opacity: 1; }
    .interim { color: var(--interim); font-size: 17px; line-height: 1.5; padding: 0 0 4px; }
    .interim:empty { display: none; }

    .hlabel {
      position: relative;
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: 0; padding: 0; margin-top: 6px;
      font-size: 13px; font-weight: 700; color: var(--hint);
    }
    .hlabel::after { content: ""; position: absolute; left: -8px; right: -8px; top: -15px; bottom: -15px; }
    .hcard {
      background: var(--soft);
      border-radius: 12px;
      padding: 14px 14px 14px;
      margin: 6px 0 4px;
      max-width: 520px;
    }
    .hprompt { display: flex; gap: 8px; font-size: 15px; font-style: italic; color: var(--hint); }
    .hprompt svg { margin-top: 3px; }
    .hactions { display: flex; align-items: center; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
    .covered-btn {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 48px; padding: 0 18px;
      background: var(--surface);
      border: 1.5px solid var(--border-input);
      border-radius: 24px;
      font-size: 15px; font-weight: 700;
    }
    .or { font-size: 14px; color: var(--text-2); white-space: nowrap; }

    /* Tools: chips, Nudge me, mic. Sticks to the bottom of the screen while the working is long. */
    .tools {
      position: sticky;
      bottom: var(--dock-h);
      z-index: 3;
      background: var(--surface);
      border-radius: 0 0 14px 14px;
      padding: 8px 14px 14px;
    }
    body.kb .tools { background: var(--bg); border-top: 1px solid var(--divider); border-radius: 0; margin: 0 -2px -2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
    .chips:empty { display: none; }
    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 30px; padding: 0 12px;
      background: var(--soft); border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 13px; font-weight: 700; color: var(--text-strong2);
    }
    .toolrow { display: flex; align-items: center; gap: 12px; }
    .nudge {
      display: inline-flex; align-items: center; gap: 8px;
      height: 48px; padding: 0 20px;
      background: var(--soft); border: 1px solid var(--border);
      border-radius: 24px;
      font-size: 16px; font-weight: 700;
      white-space: nowrap; flex: none;
    }
    .nudge:disabled { background: #F3F2EE; border-color: #E4E1DA; color: #8A867E; cursor: default; }
    .count { font-size: 15px; color: var(--text-2); white-space: nowrap; }
    .spacer { flex: 1; }
    .done { display: none; background: none; border: 0; height: 48px; padding: 0 6px; font-size: 16px; font-weight: 700; }
    body.kb .done { display: block; }
    .novoice { font-size: 14px; color: var(--text-2); margin: 0 0 8px; }
    .novoice:empty { display: none; }

    /* Mic */
    .mic {
      position: relative;
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--soft);
      display: inline-flex; align-items: center; justify-content: center;
    }
    .mic:disabled { color: #8A867E; background: #F3F2EE; border-color: #E4E1DA; cursor: default; }
    .mic .ring { position: absolute; inset: 0; border-radius: 50%; background: var(--accent); opacity: 0; pointer-events: none; }
    .mic.speak { background: var(--accent); color: #fff; border-color: var(--accent); }
    .mic.speak .ring { animation: pulse 1.4s ease-out infinite; }
    .mic.speak .ring + .ring { animation-delay: .7s; }
    .mic.wait { background: #E4E1DA; color: var(--text-2); border-color: transparent; }
    .mic.wait::after {
      content: ""; position: absolute; inset: -5px; border-radius: 50%;
      border: 2px dashed #8A867E; animation: spin 1.6s linear infinite;
    }
    @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.9); opacity: 0; } }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Voice status bar */
    .vbar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      display: none; align-items: center; gap: 14px;
      padding: 16px 16px 18px;
      border-top: 1px solid var(--divider);
    }
    .vbar.show { display: flex; }
    .vbar.speak { background: var(--accent); color: #fff; border-color: var(--accent); }
    .vbar.wait { background: #E4E1DA; }
    .vbar.error { background: var(--surface); }
    .vicon { width: 30px; height: 30px; border-radius: 50%; flex: none; }
    .vbar.speak .vicon { background: #fff; }
    .vbar.wait .vicon { border: 3px dashed #8A867E; animation: spin 1.6s linear infinite; }
    .vbar.error .vicon { display: none; }
    .vtext { flex: 1; min-width: 0; }
    .vtitle { font-size: 20px; font-weight: 700; line-height: 1.2; }
    .vbar.error .vtitle { display: none; }
    .vsub { font-size: 15px; }
    .vstop {
      flex: none; min-height: 48px; padding: 0 22px;
      background: var(--surface); color: var(--text);
      border: 1.5px solid var(--border-input); border-radius: 14px;
      font-size: 16px; font-weight: 700;
    }

    @media (prefers-reduced-motion: reduce) {
      .mic.speak .ring { animation: none; opacity: .25; transform: scale(1.3); }
      .mic.wait::after, .vbar.wait .vicon { animation: none; }
    }

    /* Estimate */
    .estimate {
      position: sticky; bottom: 0; z-index: 4;
      margin: 0 -16px;
      padding: 14px 16px 18px;
      background: var(--bg);
      border-top: 1px solid var(--divider);
    }
    body.kb.focus-working .estimate, body.voice .estimate { display: none; }
    body.submitted .estimate { position: static; }
    /* Room to scroll the working clear of the voice bar. */
    body.voice main { padding-bottom: calc(var(--dock-h) + 16px); }
    .erow1 { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; }
    .elabel { font-size: 15px; font-weight: 700; }
    .easked { font-size: 14px; color: var(--text-2); text-align: right; }
    .erow2 { display: flex; gap: 10px; }
    .einput {
      flex: 1; min-width: 0;
      display: flex; align-items: center;
      height: 52px; padding: 0 16px;
      background: var(--surface);
      border: 1.5px solid var(--border-input);
      border-radius: 14px;
    }
    .einput:focus-within { border: 2px solid var(--accent); }
    .einput input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 20px; font-weight: 700; }
    .einput input::placeholder { color: #8A867E; }
    .unit { font-size: 16px; color: var(--text-2); }
    .submit {
      width: 112px; height: 52px; flex: none;
      border: 0; border-radius: 14px;
      background: var(--accent); color: #fff;
      font-size: 17px; font-weight: 700;
    }
    .submit:disabled { background: #DDD9D1; color: var(--text-2); cursor: default; }

    /* Version switcher */
    .switcher { max-width: 560px; margin: 0 auto; padding: 12px 16px 0; }
    .vlinks { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .vlinks a {
      display: flex; align-items: center; justify-content: center; text-align: center;
      min-height: 48px; padding: 4px 6px;
      background: var(--surface); border: 1.5px solid var(--border-input); border-radius: 12px;
      color: var(--text); text-decoration: none; font-size: 13px; font-weight: 700; line-height: 1.2;
    }
    .vlinks a[aria-current="page"] { background: var(--text); border-color: var(--text); color: #fff; }
    .vdesc { margin: 8px 0 0; font-size: 14px; color: var(--text-2); }
    body.kb .switcher { display: none; }

    /* Closed boxes and folded hints */
    .hcard.tappable { cursor: pointer; }
    .hlabel .fold { margin-left: 4px; transition: transform .15s; }
    .section.folded .hlabel .fold { transform: rotate(-90deg); }
    .preview { font-size: 15px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 0 0; }

    /* Saved data */
    .saved { padding: 4px 0 24px; }
    .saved[hidden] { display: none; }
    .saved h2 { font-size: 17px; margin: 0 0 8px; }
    .saved p { margin: 0 0 10px; color: var(--text-2); font-size: 14px; }
    .saved pre {
      margin: 0; padding: 14px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      font-size: 13px; line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    }

    /* Laptop */
    @media (min-width: 900px) {
      .switcher { max-width: none; padding: 16px 80px 0; }
      .vlinks { grid-template-columns: repeat(4, max-content); }
      .vlinks a { padding: 4px 16px; }
      .topbar {
        display: flex; align-items: center;
        height: 72px; padding: 0 80px;
        border-bottom: 1px solid var(--divider);
      }
      .wordmark { font-size: 22px; font-weight: 700; color: var(--accent); }
      main {
        max-width: none;
        padding: 32px 80px 32px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        grid-template-rows: auto 1fr auto;
        gap: 24px 32px;
        min-height: calc(100dvh - 72px);
      }
      .qbar { grid-column: 1; grid-row: 1; position: static; margin: 0; padding: 0; }
      .qtext { font-size: 30px; }
      .working { grid-column: 2; grid-row: 1 / span 3; min-height: 520px; }
      .estimate {
        grid-column: 1; grid-row: 3; position: static; margin: 0;
        background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px;
      }
      body.kb.focus-working .estimate { display: block; }
      .saved { grid-column: 1 / span 2; }
      .tools { position: static; }
      .vbar { left: auto; right: 24px; bottom: 24px; width: 420px; border-radius: 16px; border: 1px solid var(--divider); }
    }
  </style>
</head>
<body>
  <header class="topbar"><span class="wordmark">guesstimate professor</span></header>

  <nav class="switcher" aria-label="Versions">
    <div class="vlinks" id="vlinks"></div>
    <p class="vdesc" id="vdesc"></p>
  </nav>

  <main>
    <div class="qbar" id="qbar">
      <button class="qcard" id="qcard" type="button" aria-expanded="true">
        <span class="qinner">
          <span class="qhead">
            <span class="tag">
              <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="13" width="4" height="8" rx="1.5"/><rect x="10" y="8" width="4" height="13" rx="1.5"/><rect x="17" y="3" width="4" height="18" rx="1.5"/></svg>
              <span id="qdiff"></span>
            </span>
          </span>
          <span class="qtext" id="qtext"></span>
        </span>
        <svg class="chev" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3E3C38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
    </div>

    <section class="working" aria-label="Your working">
      <div class="stack" id="stack"></div>
      <div class="tools" id="tools">
        <p class="novoice" id="novoice"></p>
        <div class="chips" id="chips" aria-label="Hints you covered"></div>
        <div class="toolrow">
          <button class="nudge" id="nudge" type="button">
            <svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
            Nudge me
          </button>
          <span class="count" id="count"></span>
          <span class="spacer"></span>
          <button class="mic" id="mic" type="button" aria-label="Speak">
            <span class="ring"></span><span class="ring"></span>
            <svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position:relative"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
          </button>
          <button class="done" id="done" type="button">Done</button>
        </div>
      </div>
    </section>

    <section class="estimate" id="estimate" aria-label="Your estimate">
      <div class="erow1">
        <label class="elabel" for="est">Your estimate</label>
        <span class="easked" id="easked"></span>
      </div>
      <div class="erow2">
        <div class="einput">
          <input id="est" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 10,000">
          <span class="unit" id="unit"></span>
        </div>
        <button class="submit" id="submit" type="button" disabled>Submit</button>
      </div>
    </section>

    <section class="saved" id="saved" hidden aria-live="polite">
      <h2>Saved data</h2>
      <p>This is what the app would save for this attempt.</p>
      <pre id="json"></pre>
    </section>
  </main>

  <div class="vbar" id="vbar" role="status">
    <span class="vicon"></span>
    <div class="vtext">
      <div class="vtitle" id="vtitle"></div>
      <div class="vsub" id="vsub"></div>
    </div>
    <button class="vstop" id="vstop" type="button">Stop</button>
  </div>

  <script>
    // ---------------------------------------------------------------
    // 1. The question (hard-coded for this test)
    // ---------------------------------------------------------------
    var QUESTION = {
      id: 'swiggy-drivers-mumbai',
      text: 'Estimate the number of Swiggy drivers in Mumbai',
      difficulty: 'Hard',
      unit: 'drivers',
      askedFor: 'drivers, a total',
      firstPrompt: 'What limits this number?',
      hints: [
        { id: 'one-unit', label: 'One unit', prompt: 'Have you decided what counts as one driver?' },
        { id: 'total-demand', label: 'Total demand', prompt: 'Have you built total demand with a funnel?' },
        { id: 'one-driver', label: 'One driver', prompt: 'Have you worked out what one driver handles?' },
        { id: 'divide', label: 'Divide', prompt: 'Have you divided demand by what one driver handles?' },
        { id: 'rush-vs-average', label: 'Rush vs average', prompt: 'Have you sized for the lunch rush, not the daily average?' },
        { id: 'sanity-check', label: 'Sanity check', prompt: 'Have you sanity-checked against a known figure?' }
      ]
    };

    // ---------------------------------------------------------------
    // Versions. Each one handles empty hint boxes differently.
    // Switching version reloads the page with ?v=1 to ?v=4.
    // ---------------------------------------------------------------
    var VERSIONS = {
      1: { name: 'As it is', desc: 'Every hint you skip keeps its empty box.' },
      2: { name: 'Box on demand', desc: 'A hint has no box until you tap the card. An empty box closes when you move on.' },
      3: { name: 'One open box', desc: 'Only the newest hint keeps an empty box. Tap an older card to reopen its box.' },
      4: { name: 'Fold any hint', desc: 'Tap a hint heading to fold it shut or open it again.' }
    };
    var V = parseInt(new URLSearchParams(location.search).get('v'), 10);
    if (!VERSIONS[V]) V = 1;
    (function () {
      var links = document.getElementById('vlinks');
      Object.keys(VERSIONS).forEach(function (k) {
        var a = document.createElement('a');
        a.href = '?v=' + k;
        a.textContent = k + '. ' + VERSIONS[k].name;
        if (+k === V) a.setAttribute('aria-current', 'page');
        links.appendChild(a);
      });
      document.getElementById('vdesc').textContent = VERSIONS[V].desc;
    })();

    // ---------------------------------------------------------------
    // 2. Where hints come from.
    // The screen only calls next() and remaining(). In Release 2 an AI
    // version with the same two functions replaces this one.
    // ---------------------------------------------------------------
    function makeScriptPromptSource(hints) {
      var index = 0;
      return {
        name: 'script',
        next: function () { return index < hints.length ? hints[index++] : null; },
        remaining: function () { return hints.length - index; }
      };
    }
    var promptSource = makeScriptPromptSource(QUESTION.hints);

    // ---------------------------------------------------------------
    // 3. The data. The screen is drawn from this list.
    // ---------------------------------------------------------------
    var sections = [];   // { hint: null or {id,label,prompt}, text, source, el, box, interim }
    var covered = [];    // hints marked "Already covered"
    var hintsUsed = 0;
    var lastBox = null;  // last text box the user was in (voice goes here)

    var stackEl = document.getElementById('stack');
    var chipsEl = document.getElementById('chips');
    var nudgeBtn = document.getElementById('nudge');
    var countEl = document.getElementById('count');

    var ICON_BUBBLE = function (size, weight) {
      return '<svg aria-hidden="true" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="' + weight + '" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
    };
    var ICON_TICK = '<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

    function growBox(box) {
      var y = window.scrollY;
      box.style.height = 'auto';
      box.style.height = box.scrollHeight + 'px';
      window.scrollTo(0, y);
      keepCaretVisible(box);
    }

    // Keeps the line you are typing on just above the Nudge me bar.
    // A hidden copy of the box, filled with the text up to the cursor,
    // shows how far down the cursor is.
    var mirror = document.createElement('div');
    mirror.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:pre-wrap;overflow-wrap:break-word;font-size:17px;line-height:1.5;padding:4px 0;';
    document.body.appendChild(mirror);
    // pos: where to measure to. Typing uses the cursor; voice passes the end of its words.
    function keepCaretVisible(box, pos) {
      if (pos == null) {
        if (document.activeElement !== box) return;
        pos = box.selectionEnd;
      }
      mirror.style.width = box.clientWidth + 'px';
      mirror.style.fontFamily = getComputedStyle(box).fontFamily;
      mirror.textContent = box.value.slice(0, pos) + '\u200b';
      var caretBottom = box.getBoundingClientRect().top + mirror.offsetHeight - 4;
      keepAboveTools(caretBottom);
    }
    function keepAboveTools(bottom) {
      var limit = document.getElementById('tools').getBoundingClientRect().top - 12;
      if (bottom > limit) { window.scrollBy(0, bottom - limit); return; }
      var top = document.getElementById('qbar').getBoundingClientRect().bottom + 40;
      if (bottom < top) window.scrollBy(0, bottom - top);
    }

    function addSection(hint, source) {
      // open: whether the box under a hint shows. Version 2 starts hints closed.
      var s = { hint: hint, text: '', source: source, open: !(hint && V === 2) };
      var el = document.createElement('div');
      el.className = 'section';

      if (hint) {
        var label = document.createElement('button');
        label.type = 'button';
        label.className = 'hlabel';
        label.innerHTML = ICON_BUBBLE(12, 2.2) + '<span></span>';
        label.lastChild.textContent = hint.label;
        if (V === 4) {
          label.insertAdjacentHTML('beforeend', '<svg class="fold" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>');
          label.addEventListener('click', function () { s.open = !s.open; updateHintLook(s); if (s.open) s.box.focus(); });
        } else {
          label.addEventListener('click', function () { s.box.focus(); });
        }

        var card = document.createElement('div');
        card.className = 'hcard';
        card.innerHTML = '<div class="hprompt">' + ICON_BUBBLE(15, 2) + '<span></span></div>' +
          '<div class="hactions"><button type="button" class="covered-btn">' + ICON_TICK + 'Already covered</button>' +
          '<span class="or">or answer below</span></div>';
        card.querySelector('.hprompt span').textContent = hint.prompt;
        card.querySelector('.covered-btn').addEventListener('click', function (e) { e.stopPropagation(); markCovered(s); });
        if (V === 2 || V === 3) {
          card.classList.add('tappable');
          card.addEventListener('click', function () { if (!s.open) openSection(s); });
        }

        var preview = document.createElement('div');
        preview.className = 'preview';
        el.appendChild(label);
        el.appendChild(card);
        el.appendChild(preview);
        s.labelEl = label;
        s.cardEl = card;
        s.previewEl = preview;
      }

      var box = document.createElement('textarea');
      box.className = 'box';
      box.rows = 1;
      box.setAttribute('aria-label', hint ? hint.label : 'Your working');
      if (!hint) box.placeholder = QUESTION.firstPrompt;
      box.addEventListener('input', function () {
        s.text = box.value;
        growBox(box);
        updateHintLook(s);
        voice.userEdited(box);
      });
      box.addEventListener('focus', function () {
        if (V === 2) closeEmptyExcept(s);
        if (lastBox !== box) voice.targetChanged(box);
        lastBox = box;
      });

      var interim = document.createElement('div');
      interim.className = 'interim';

      el.appendChild(box);
      el.appendChild(interim);
      stackEl.appendChild(el);

      s.el = el; s.box = box; s.interim = interim;
      box.section = s;
      sections.push(s);
      updateHintLook(s);
      return s;
    }

    // A hint shows as a full card until the user writes under it, then as a short heading.
    function updateHintLook(s) {
      if (!s.hint) return;
      var answered = s.text.trim() !== '';
      if (V === 4) {
        s.labelEl.hidden = false;
        s.cardEl.hidden = answered || !s.open;
        s.previewEl.hidden = s.open || !answered;
        s.previewEl.textContent = s.text.trim().split('\n')[0];
        s.el.classList.toggle('folded', !s.open);
      } else {
        s.labelEl.hidden = !answered;
        s.cardEl.hidden = answered;
        s.previewEl.hidden = true;
      }
      s.box.hidden = !s.open;
      s.interim.hidden = !s.open;
      s.cardEl.querySelector('.or').textContent = s.open ? 'or answer below' : 'or tap to answer';
    }

    // Opens the box under a hint (versions 2 and 3).
    function openSection(s) {
      s.open = true;
      closeEmptyExcept(s);
      updateHintLook(s);
      s.box.focus();
      keepCaretVisible(s.box, 0);
    }

    // Closes every empty hint box except one (versions 2 and 3).
    function closeEmptyExcept(keep) {
      if (V !== 2 && V !== 3) return;
      sections.forEach(function (s) {
        if (s === keep || !s.hint || !s.open || s.text.trim() !== '') return;
        if (voice.isTarget(s.box)) return;
        s.open = false;
        updateHintLook(s);
      });
    }

    function updateHintStrip() {
      chipsEl.innerHTML = '';
      covered.forEach(function (h) {
        var chip = document.createElement('span');
        chip.className = 'chip';
        chip.innerHTML = ICON_TICK + '<span></span>';
        chip.lastChild.textContent = h.label + ', covered';
        chipsEl.appendChild(chip);
      });
      var left = promptSource.remaining();
      nudgeBtn.disabled = left === 0;
      countEl.textContent = left === 0 ? 'All shown' : (hintsUsed === 0 ? '' : left + ' left');
    }

    function nudge() {
      var hint = promptSource.next();
      if (!hint) return;
      hintsUsed++;
      var s = addSection(hint, promptSource.name);
      closeEmptyExcept(V === 3 ? s : null);
      updateHintStrip();
      if (s.open) s.box.focus();
      s.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    function markCovered(s) {
      var i = sections.indexOf(s);
      if (i === -1 || s.text.trim() !== '') return;
      if (voice.isTarget(s.box)) voice.stop();
      sections.splice(i, 1);
      s.el.remove();
      covered.push(s.hint);
      if (lastBox === s.box) lastBox = null;
      updateHintStrip();
      var before = sections[Math.max(0, i - 1)];
      if (before && document.body.classList.contains('kb')) placeCaretAtEnd(before.box);
    }

    function placeCaretAtEnd(box) {
      box.focus();
      box.selectionStart = box.selectionEnd = box.value.length;
    }

    // Tapping empty space in the working goes to the last box.
    stackEl.addEventListener('click', function (e) {
      if (e.target === stackEl) placeCaretAtEnd(sections[sections.length - 1].box);
    });

    nudgeBtn.addEventListener('click', nudge);

    // Buttons in the working should not close the keyboard or move the cursor.
    [nudgeBtn, document.getElementById('mic'), document.getElementById('qcard')].forEach(function (b) {
      b.addEventListener('mousedown', function (e) { if (document.body.classList.contains('kb')) e.preventDefault(); });
    });
    document.getElementById('done').addEventListener('click', function () { document.activeElement.blur(); });

    // ---------------------------------------------------------------
    // 4. Question bar: collapses while the keyboard is open
    // ---------------------------------------------------------------
    document.getElementById('qtext').textContent = QUESTION.text;
    document.getElementById('qdiff').textContent = QUESTION.difficulty;
    var qbar = document.getElementById('qbar');
    var qcard = document.getElementById('qcard');
    qcard.addEventListener('click', function () {
      if (!document.body.classList.contains('kb')) return;
      qbar.classList.toggle('open');
      qcard.setAttribute('aria-expanded', qbar.classList.contains('open'));
    });

    // The keyboard counts as open when a text field has focus and the screen
    // has lost more than a fifth of its height.
    var tallest = window.innerHeight;
    function checkKeyboard() {
      var h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      if (h > tallest) tallest = h;
      var a = document.activeElement;
      var typing = a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT');
      var open = typing && h < tallest * 0.8;
      var was = document.body.classList.contains('kb');
      document.body.classList.toggle('kb', !!open);
      document.body.classList.toggle('focus-working', !!(a && a.tagName === 'TEXTAREA'));
      if (!open && was) { qbar.classList.remove('open'); }
      qcard.setAttribute('aria-expanded', !open || qbar.classList.contains('open'));
      updateDock();
      var a2 = document.activeElement;
      if (a2 && a2.tagName === 'TEXTAREA') keepCaretVisible(a2);
    }
    window.addEventListener('resize', checkKeyboard);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', checkKeyboard);
    document.addEventListener('focusin', function () { setTimeout(checkKeyboard, 50); setTimeout(checkKeyboard, 400); });
    document.addEventListener('focusout', function () { setTimeout(checkKeyboard, 50); });
    window.addEventListener('orientationchange', function () { tallest = 0; setTimeout(checkKeyboard, 300); });

    // Keeps the hint bar above whatever is pinned to the bottom of the screen.
    var estimateEl = document.getElementById('estimate');
    var vbarEl = document.getElementById('vbar');
    function updateDock() {
      var h = 0;
      if (vbarEl.classList.contains('show')) h = vbarEl.offsetHeight;
      else if (getComputedStyle(estimateEl).position === 'sticky' && estimateEl.offsetParent) h = estimateEl.offsetHeight;
      document.documentElement.style.setProperty('--dock-h', h + 'px');
    }

    // ---------------------------------------------------------------
    // 5. Voice. Speech logic from prototypes/voice-test, changed so
    // words go into the last box at the cursor.
    // ---------------------------------------------------------------
    var voice = (function () {
      var micBtn = document.getElementById('mic');
      var vtitle = document.getElementById('vtitle');
      var vsub = document.getElementById('vsub');
      var vstop = document.getElementById('vstop');
      var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      // Errors that restarting will not fix, so listening stops for good.
      var STOPPING_ERRORS = ['not-allowed', 'service-not-allowed', 'audio-capture', 'network', 'language-not-supported'];
      var ERROR_MESSAGES = {
        'network': 'Voice stopped: connection lost. Your text is kept.',
        'not-allowed': 'Microphone blocked. Allow it for this site in Chrome settings. Your text is kept.',
        'service-not-allowed': 'The browser would not let this page use voice. Your text is kept.',
        'audio-capture': 'No microphone found, or another app is using it. Your text is kept.',
        'language-not-supported': 'This browser does not support British English voice. Your text is kept.'
      };

      var wantListening = false;
      // One "session" runs from each start until Chrome stops. While it runs,
      // its words sit in one place in one box: from anchor, inserted characters long.
      var session = null; // { box, anchor, inserted, pending }

      function setState(state, message) {
        micBtn.classList.toggle('speak', state === 'speak');
        micBtn.classList.toggle('wait', state === 'wait');
        micBtn.setAttribute('aria-label', state === 'idle' || state === 'error' ? 'Speak' : 'Stop speaking');
        vbarEl.className = 'vbar' + (state === 'idle' ? '' : ' show ' + state);
        document.body.classList.toggle('voice', state !== 'idle');
        if (state === 'speak') { vtitle.textContent = 'Speak now'; vsub.textContent = 'Listening. Words go in at the cursor.'; vstop.textContent = 'Stop'; }
        if (state === 'wait') { vtitle.textContent = 'Wait'; vsub.textContent = "Mic restarting. Words said now won't be caught."; vstop.textContent = 'Stop'; }
        if (state === 'error') { vtitle.textContent = ''; vsub.textContent = message; vstop.textContent = 'Start again'; }
        updateDock();
      }

      function targetBox() {
        if (lastBox && lastBox.isConnected && !lastBox.hidden) return lastBox;
        var open = sections.filter(function (s) { return !s.box.hidden; });
        return open[open.length - 1].box;
      }

      function bindSession() {
        var box = targetBox();
        // A text box remembers its cursor even after focus moves to the mic button.
        var at = box === lastBox && box.selectionStart != null ? box.selectionStart : box.value.length;
        session = { box: box, anchor: at, inserted: '', pending: '' };
      }

      // Put this session's words into the box, replacing what it put in before.
      function writeWords(words) {
        if (!session) return;
        var box = session.box;
        var v = box.value;
        var before = v.slice(0, session.anchor);
        var after = v.slice(session.anchor + session.inserted.length);
        var text = words;
        if (text && before && !/\s$/.test(before)) text = ' ' + text;
        if (text && after && !/^\s/.test(after) && !/\s$/.test(text)) text = text + ' ';
        box.value = before + text + after;
        session.inserted = text;
        var caret = session.anchor + text.length;
        if (document.activeElement === box) box.selectionStart = box.selectionEnd = caret;
        box.section.text = box.value;
        growBox(box);
        updateHintLook(box.section);
        keepCaretVisible(box, caret);
      }

      function showInterim(text) {
        sections.forEach(function (s) { s.interim.textContent = ''; });
        if (session && text) {
          var line = session.box.section.interim;
          line.textContent = text;
          keepAboveTools(line.getBoundingClientRect().bottom);
        }
      }

      // End the session: keep its words, including grey ones, in the box.
      function closeSession() {
        if (!session) return;
        writeWords((session.pending || session.inserted).trim());
        showInterim('');
        session = null;
      }

      if (!SpeechRecognition) {
        micBtn.disabled = true;
        document.getElementById('novoice').textContent = 'Voice works in Google Chrome. You can type your answer.';
        return { userEdited: function () {}, targetChanged: function () {}, isTarget: function () { return false; }, stop: function () {} };
      }

      var recognition = new SpeechRecognition();
      recognition.lang = 'en-GB';
      recognition.interimResults = true;
      recognition.continuous = true;

      function startsWith(text, start) {
        return text.toLowerCase().indexOf(start.toLowerCase()) === 0;
      }

      recognition.onstart = function () {
        bindSession();
        setState('speak');
      };

      // Chrome on Android often resends the whole sentence so far as each new
      // result. If a piece starts with the previous piece, it replaces it.
      recognition.onresult = function (event) {
        if (!session) return;
        var parts = [];
        var interimText = '';
        for (var i = 0; i < event.results.length; i++) {
          var text = event.results[i][0].transcript.trim();
          if (!text) continue;
          if (event.results[i].isFinal) {
            var last = parts[parts.length - 1];
            if (last && startsWith(text, last)) parts[parts.length - 1] = text;
            else parts.push(text);
          } else {
            interimText += (interimText ? ' ' : '') + text;
          }
        }
        var shown = parts.slice();
        if (interimText && shown.length && startsWith(interimText, shown[shown.length - 1])) shown.pop();
        var shownText = shown.join(' ');
        writeWords(shownText);
        showInterim(interimText);
        // Remember grey words too: Chrome can stop before it confirms the last words.
        session.pending = interimText ? (shownText ? shownText + ' ' : '') + interimText : parts.join(' ');
      };

      recognition.onerror = function (event) {
        // Silence during a thinking pause is normal while restarting.
        if (STOPPING_ERRORS.indexOf(event.error) === -1) return;
        wantListening = false;
        closeSession();
        setState('error', ERROR_MESSAGES[event.error] || 'Voice stopped. Your text is kept.');
      };

      function startListening() {
        try {
          recognition.start();
        } catch (err) {
          wantListening = false;
          setState('error', 'Could not start voice. Your text is kept.');
        }
      }

      recognition.onend = function () {
        closeSession();
        if (wantListening) {
          // Chrome stopped by itself (for example after a pause): listen again.
          setState('wait');
          startListening();
        } else if (!vbarEl.classList.contains('error')) {
          setState('idle');
        }
      };

      function start() {
        // Close the keyboard: you are talking, not typing. The box keeps its cursor.
        var box = targetBox();
        lastBox = box;
        if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
        // Show where the words will go straight away, then again once the keyboard has closed.
        var showTarget = function () { keepCaretVisible(box, box.selectionEnd != null ? box.selectionEnd : box.value.length); };
        setTimeout(showTarget, 50);
        setTimeout(showTarget, 400);
        wantListening = true;
        setState('wait');
        startListening();
      }
      function stop() {
        if (!wantListening) return;
        wantListening = false;
        closeSession();
        recognition.stop();
        setState('idle');
      }

      micBtn.addEventListener('click', function () { wantListening ? stop() : start(); });
      vstop.addEventListener('click', function () {
        if (vbarEl.classList.contains('error')) { setState('idle'); start(); } else { stop(); }
      });

      return {
        // The user typed while listening: keep what is there and move to a fresh session.
        userEdited: function (box) {
          if (!session || session.box !== box) return;
          session.pending = ''; session.inserted = '';
          session = null; showInterim('');
          if (wantListening) recognition.stop();
        },
        // The user moved to another box while listening: finish here, carry on there.
        targetChanged: function (box) {
          if (!session || session.box === box) return;
          closeSession();
          if (wantListening) recognition.stop();
        },
        isTarget: function (box) { return !!session && session.box === box; },
        stop: stop
      };
    })();

    // ---------------------------------------------------------------
    // 6. Estimate and Submit
    // ---------------------------------------------------------------
    var estInput = document.getElementById('est');
    var submitBtn = document.getElementById('submit');
    var asked = document.getElementById('easked');
    document.getElementById('unit').textContent = QUESTION.unit;

    function estimateValue() {
      var digits = estInput.value.replace(/[^\d]/g, '');
      return digits ? parseInt(digits, 10) : null;
    }
    function inWords(n) {
      function trim(x) { return (Math.round(x * 10) / 10).toString(); }
      if (n >= 1e9) return trim(n / 1e9) + ' billion';
      if (n >= 1e6) return trim(n / 1e6) + ' million';
      if (n >= 1e3) return trim(n / 1e3) + ' thousand';
      return String(n);
    }
    function updateEstimate() {
      var n = estimateValue();
      submitBtn.disabled = !n;
      asked.textContent = n ? inWords(n) + ' ' + QUESTION.unit : 'Asked for: ' + QUESTION.askedFor;
    }
    estInput.addEventListener('input', function () {
      var n = estimateValue();
      estInput.value = n ? n.toLocaleString('en-GB') : '';
      updateEstimate();
    });

    submitBtn.addEventListener('click', function () {
      voice.stop();
      var data = {
        questionId: QUESTION.id,
        sections: sections.map(function (s) {
          return {
            hintId: s.hint ? s.hint.id : null,
            label: s.hint ? s.hint.label : null,
            text: s.text.trim(),
            source: s.source
          };
        }),
        coveredHints: covered.map(function (h) { return { hintId: h.id, label: h.label }; }),
        hintsUsed: hintsUsed,
        estimate: { value: estimateValue(), unit: QUESTION.unit }
      };
      document.getElementById('json').textContent = JSON.stringify(data, null, 2);
      var saved = document.getElementById('saved');
      saved.hidden = false;
      document.body.classList.add('submitted');
      updateDock();
      if (document.activeElement) document.activeElement.blur();
      setTimeout(function () { saved.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
    });

    // ---------------------------------------------------------------
    // Start
    // ---------------------------------------------------------------
    addSection(null, promptSource.name);
    updateHintStrip();
    updateEstimate();
    updateDock();
  </script>
</body>
</html>
