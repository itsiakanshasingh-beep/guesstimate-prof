<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice, speak now</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;background:#F6F5F2;color:#1C1C1A}
button,input,textarea{font:inherit;color:inherit}
.gp-hit{position:relative}.gp-hit::after{content:"";position:absolute;left:-8px;right:-8px;top:-15px;bottom:-15px}
@keyframes gpPulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.9);opacity:0}}
.gp-ring{animation:gpPulse 1.4s ease-out infinite}
.gp-ring2{animation:gpPulse 1.4s ease-out .7s infinite}
@media (prefers-reduced-motion: reduce){.gp-ring,.gp-ring2{animation:none;opacity:.25;transform:scale(1.3)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #F6F5F2; display: flex; flex-direction: column; overflow: hidden">
<div style="flex: none; padding: 12px 16px 0">
<button type="button" aria-label="Show full question" aria-expanded="false" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 52px; box-sizing: border-box; padding: 0 12px 0 10px; background: #FFFFFF; border: 1px solid #DDD9D1; border-radius: 14px; text-align: left; cursor: pointer">
<span style="flex: none; display: flex; align-items: center; gap: 6px; background: #EFEDE8; border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 13px; font-weight: 700; color: #3E3C38"><span aria-hidden="true" style="display: flex; align-items: flex-end; gap: 2px; height: 10px"><span style="width: 3px; height: 5px; background: #3E3C38; border-radius: 1px"></span><span style="width: 3px; height: 8px; background: #3E3C38; border-radius: 1px"></span><span style="width: 3px; height: 10px; background: #3E3C38; border-radius: 1px"></span></span>Hard</span>
<span style="flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16px; font-weight: 700">Estimate the number of Swiggy drivers in Mumbai</span>
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3E3C38" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</button>
</div>
<div style="flex-grow: 1; min-height: 0; overflow: hidden; padding: 12px 16px">
<div aria-label="Your working" style="box-sizing: border-box; background: #FFFFFF; border: 1.5px solid #CFCAC0; border-radius: 16px; padding: 14px 16px 12px; font-size: 17px; line-height: 1.5">
<button type="button" class="gp-hit" aria-label="Show prompt: Have you decided what counts as one driver?" style="display: flex; align-items: center; gap: 6px; padding: 0; background: transparent; border: 0; font-size: 13px; font-weight: 700; color: #67645E; cursor: pointer"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>One unit</button>
<div>driver = on the app at lunch peak</div>
<div style="display: flex; align-items: flex-start; gap: 8px; margin-top: 10px; font-size: 15px; line-height: 1.4; font-style: italic; color: #67645E"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 3px"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg><span>Have you built total demand with a funnel?</span></div>
<div>mumbai 20m, ~4m order food online</div>
<div>~1.5m orders/day, swiggy ~45% = 700k</div>
<div style="color: #75726B">about a quarter of those at lunch<span style="display: inline-block; width: 2px; height: 21px; margin-left: 2px; vertical-align: -4px; background: {{accent}}"></span></div>
<div style="margin-top: 14px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px 0 12px; background: #EFEDE8; border: 1px solid #DDD9D1; border-radius: 22px; font-size: 15px; font-weight: 700; cursor: pointer"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"></path></svg>Nudge me</button>
<span style="font-size: 14px; color: #5E5B55">4 left</span>
</div>
<div style="position: relative; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center">
<span aria-hidden="true" class="gp-ring" style="position: absolute; left: 4px; top: 4px; width: 48px; height: 48px; border-radius: 24px; background: {{accent}}"></span>
<span aria-hidden="true" class="gp-ring2" style="position: absolute; left: 4px; top: 4px; width: 48px; height: 48px; border-radius: 24px; background: {{accent}}"></span>
<button type="button" aria-label="Listening. Tap to stop" aria-pressed="true" style="position: relative; width: 48px; height: 48px; border-radius: 24px; background: {{accent}}; border: 0; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></button>
</div>
</div>
</div>
</div>
<div role="status" style="flex: none; box-sizing: border-box; padding: 16px 16px 28px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; gap: 14px">
<div aria-hidden="true" style="flex: none; position: relative; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center">
<span class="gp-ring" style="position: absolute; left: 7px; top: 7px; width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF"></span>
<span style="position: relative; width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF"></span>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 20px; font-weight: 700">Speak now</span>
<span style="font-size: 14px; line-height: 1.35">Listening. Words go in at the cursor.</span>
</div>
<button type="button" style="flex: none; height: 52px; padding: 0 18px; background: #FFFFFF; border: 0; border-radius: 14px; color: #1C1C1A; font-size: 16px; font-weight: 700; cursor: pointer">Stop</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D6B63"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#1D6B63' };
}
}
</script>
</body>
</html>
