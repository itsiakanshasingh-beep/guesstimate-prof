<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone keyboard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div aria-hidden="true" style="width: 390px; height: 290px; box-sizing: border-box; background: #D3D2CD; padding: 8px 4px 0; display: flex; flex-direction: column; gap: 11px; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 21px; color: #1C1C1A">
<div style="display: flex; gap: 6px"><sc-for list="{{r1}}" as="key" hint-placeholder-count="10"><div style="flex: 1 1 0; height: 44px; background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 0 #A3A19B; display: flex; align-items: center; justify-content: center">{{key.k}}</div></sc-for></div>
<div style="display: flex; gap: 6px; padding: 0 19px"><sc-for list="{{r2}}" as="key" hint-placeholder-count="9"><div style="flex: 1 1 0; height: 44px; background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 0 #A3A19B; display: flex; align-items: center; justify-content: center">{{key.k}}</div></sc-for></div>
<div style="display: flex; gap: 6px"><div style="flex: 1.45 1 0; height: 44px; background: #B7B5AF; border-radius: 6px; box-shadow: 0 1px 0 #A3A19B; display: flex; align-items: center; justify-content: center; font-size: 18px">⇧</div><sc-for list="{{r3}}" as="key" hint-placeholder-count="7"><div style="flex: 1 1 0; height: 44px; background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 0 #A3A19B; display: flex; align-items: center; justify-content: center">{{key.k}}</div></sc-for><div style="flex: 1.45 1 0; height: 44px; background: #B7B5AF; border-radius: 6px; box-shadow: 0 1px 0 #A3A19B; display: flex; align-items: center; justify-content: center; font-size: 18px">⌫</div></div>
<div style="display: flex; gap: 6px; font-size: 16px"><div style="flex: 1.3 1 0; height: 44px; background: #B7B5AF; border-radius: 6px; box-shadow: 0 1px 0 #A3A19B; display: flex; align-items: center; justify-content: center">123</div><div style="flex: 5 1 0; height: 44px; background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 0 #A3A19B; display: flex; align-items: center; justify-content: center">space</div><div style="flex: 2 1 0; height: 44px; background: #B7B5AF; border-radius: 6px; box-shadow: 0 1px 0 #A3A19B; display: flex; align-items: center; justify-content: center">return</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":290}}'>
class Component extends DCLogic {
renderVals() {
var row = function (s) { return s.split('').map(function (k) { return { k: k }; }); };
return { r1: row('qwertyuiop'), r2: row('asdfghjkl'), r3: row('zxcvbnm') };
}
}
</script>
</body>
</html>
