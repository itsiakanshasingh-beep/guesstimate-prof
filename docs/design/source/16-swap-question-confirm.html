<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Answer, confirm swapping the question</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;background:#F6F5F2;color:#1C1C1A}
button,input,textarea{font:inherit;color:inherit}
a{color:#1C1C1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; background: #F6F5F2; overflow: hidden">
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<section style="background: #FFFFFF; border: 1px solid #DDD9D1; border-radius: 16px; padding: 8px 12px 20px 18px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px; background: #EFEDE8; border-radius: 999px; padding: 5px 12px 5px 10px; font-size: 14px; font-weight: 700; color: #3E3C38">Hard</div>
<span style="display: flex; align-items: center; height: 48px; padding: 0 6px; font-size: 15px; text-decoration: underline">Different question</span>
</div>
<div style="font-size: 22px; line-height: 1.32; font-weight: 700">Estimate the number of Swiggy drivers in Mumbai</div>
</section>
<div style="flex-grow: 1; background: #FFFFFF; border: 1.5px solid #CFCAC0; border-radius: 16px; padding: 14px 16px; font-size: 17px; line-height: 1.5">
<div>swiggy drivers mumbai..</div>
<div>mumbai 20m, maybe 4m order online</div>
<div>swiggy ~700k orders a day?</div>
</div>
</div>
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(28, 28, 26, 0.45)"></div>
<section role="dialog" aria-modal="true" aria-labelledby="v2-swap-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 20px 20px 0 0; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 12px">
<h2 id="v2-swap-title" style="margin: 0; font-size: 21px; font-weight: 700">Swap this question?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.45; color: #3E3C38">You'll get another hard question. Your working on this one will be cleared.</p>
<div style="display: flex; flex-direction: column; gap: 10px; margin-top: 8px">
<button type="button" style="height: 56px; border: 0; border-radius: 14px; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer">Keep working</button>
<button type="button" style="height: 56px; background: #FFFFFF; border: 1.5px solid #CFCAC0; border-radius: 14px; font-size: 17px; font-weight: 700; cursor: pointer">Swap question</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1D6B63"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#1D6B63' };
}
}
</script>
</body>
</html>
