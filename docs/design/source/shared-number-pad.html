<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone number pad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div aria-hidden="true" style="width: 390px; height: 290px; box-sizing: border-box; background: #D3D2CD; padding: 8px 6px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(4, 52px); gap: 7px; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; font-size: 24px; color: #1C1C1A">
<sc-for list="{{keys}}" as="key" hint-placeholder-count="9"><div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 0 #A3A19B; display: flex; align-items: center; justify-content: center">{{key.k}}</div></sc-for>
<div></div>
<div style="background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 0 #A3A19B; display: flex; align-items: center; justify-content: center">0</div>
<div style="display: flex; align-items: center; justify-content: center; font-size: 20px">⌫</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":290}}'>
class Component extends DCLogic {
renderVals() {
return { keys: '123456789'.split('').map(function (k) { return { k: k }; }) };
}
}
</script>
</body>
</html>
